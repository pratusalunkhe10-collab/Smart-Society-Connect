services:

  mysql:
    image: mysql:8.0
    container_name: smart-society-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_society_connect_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-smartuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - smart_society_mysql_data:/var/lib/mysql
      - ./backend/database/fresh_install_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: ./backend

    image: smart-society-backend
    container_name: smart-society-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smart_society_connect_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-smartuser}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      JPA_DDL_AUTO: validate

      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_UPLOAD_DIR: /app/uploads/documents

      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

    ports:
      - "8080:8080"

    volumes:
      - smart_society_uploads:/app/uploads


  frontend:
    build:
      context: ./frontend

    image: smart-society-frontend
    container_name: smart-society-frontend
    restart: unless-stopped

    depends_on:
      - backend

    environment:
      BACKEND_URL: http://backend:8080

    ports:
      - "3000:80"


volumes:
  smart_society_mysql_data:
  smart_society_uploads: