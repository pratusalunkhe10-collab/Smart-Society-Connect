# =========================================
# APPLICATION CONFIG
# =========================================

spring.application.name=smart-society-connect
server.port=${SERVER_PORT:8080}

# Comma-separated frontend origins. Override APP_CORS_ALLOWED_ORIGINS in deployment.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =========================================
# JWT CONFIGURATION
# =========================================

# Set APP_JWT_SECRET to a unique 32+ character value in every non-local environment.
app.jwt.secret=${APP_JWT_SECRET:change-this-development-jwt-secret-before-production-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.upload.dir=${APP_UPLOAD_DIR:uploads/documents}
# Runs once daily at 09:00 server time; override with APP_BILLING_REMINDER_CRON if required.
app.billing.reminder-cron=${APP_BILLING_REMINDER_CRON:0 0 9 * * *}

# Razorpay credentials. Keep the secret values in environment variables.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# =========================================
# DATABASE CONFIGURATION
# =========================================
# Local clone works with MySQL on localhost by default.
# Cloud users should override DB_URL, DB_USERNAME and DB_PASSWORD in their hosting environment.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_society_connect_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / HIBERNATE CONFIGURATION
# =========================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================
# LOGGING
# =========================================

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG_LEVEL:WARN}

# =========================================
# EMAIL / OTP CONFIGURATION
# =========================================
# The current EmailServiceImpl uses the Resend HTTP API.
# Set RESEND_API_KEY in your local/cloud environment; never hard-code it here.
# Set RESEND_FROM_EMAIL to a sender/domain verified in your Resend account.
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Optional legacy SMTP properties retained for compatibility with older/local setups.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

# =========================================
# Swagger / OpenAPI
# =========================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
